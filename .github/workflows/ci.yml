name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Meditation scheduler
        run: node test_meditation_scheduler.js
      - name: Jamestellation puzzle
        run: node test_jamestellation_puzzle.js
