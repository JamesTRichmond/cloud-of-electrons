<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud of Electrons</title>
<style>
@font-face{font-family:"Source Serif 4";src:url(SourceSerif4.ttf)}
html,body{margin:0;height:100%;background:#05070D;overflow:hidden}
#coe{position:fixed;inset:0;width:100%;height:100%;display:block}
#coe-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style></head><body>
<canvas id="coe" aria-label="A drifting cloud of particles where lines of poetry form and fade"></canvas>
<div id="coe-live" aria-live="polite"></div>
<script type="module">
import {poemTimeline,nextGap,shuffleBag,SECTIONS} from './motion.js';
const N=60000,cv=document.getElementById('coe'),gl=cv.getContext('webgl2',{antialias:false,alpha:false});
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let aspect=1;function rs(){const d=Math.min(2,devicePixelRatio);cv.width=innerWidth*d;cv.height=innerHeight*d;gl.viewport(0,0,cv.width,cv.height);aspect=innerWidth/innerHeight}rs();addEventListener('resize',rs);
const P=new Float32Array(N*3),V=new Float32Array(N*3),T=new Float32Array(N*3),C=new Float32Array(N*3),mark=new Uint8Array(N);
for(let i=0;i<N;i++){const u=Math.random()*2-1,th=Math.random()*6.2832,r=2*Math.cbrt(Math.random()),q=Math.sqrt(1-u*u);P[i*3]=r*q*Math.cos(th);P[i*3+1]=r*q*Math.sin(th);P[i*3+2]=r*u}
const hsl=(h,s,l)=>{const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return[f(0),f(8),f(4)]};
const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x};
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,`#version 300 es
in vec3 p;in vec3 c;uniform float t,asp;out vec3 vc;void main(){float a=t*.04;
vec3 q=vec3(p.x*cos(a)-p.z*sin(a),p.y,p.x*sin(a)+p.z*cos(a));q.z-=3.5;
gl_Position=vec4(q.x*1.6/max(asp,1.),q.y*1.6*min(asp,1.)*(asp<1.?1.:1.),q.z,-q.z);gl_PointSize=2.;vc=c;}`));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`#version 300 es
precision mediump float;in vec3 vc;out vec4 o;void main(){o=vec4(vc,.55);}`));
gl.linkProgram(pr);gl.useProgram(pr);


const bp=gl.createBuffer(),bc=gl.createBuffer(),lp=gl.getAttribLocation(pr,'p'),lc=gl.getAttribLocation(pr,'c');
gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
const [att,man]=await Promise.all([fetch('attractors.json').then(r=>r.json()),fetch('glyphs/manifest.json').then(r=>r.json())]);
for(const x of att.attractors)for(const k of['id','pos','radius','hue'])if(x[k]===undefined)throw new Error('attractors.json: '+x.id+' missing '+k);
const A=att.attractors,poems=man.poems,byId=Object.fromEntries(poems.map(p=>[p.id,p]));
const pick=shuffleBag(poems.map(p=>p.id),poems.filter(p=>SECTIONS[p.section]?.repeatSooner).map(p=>p.id));
const cache={};const bin=async f=>cache[f]??=new Int16Array(await (await fetch(f)).arrayBuffer());
let active=null,next=location.hash==='#poem'?0:performance.now()+4000,loading=false;const live=document.getElementById('coe-live');
let rotA=0;const calmAt=(x,y,z)=>{if(!active||!active.box)return 0;const ra=rotA*.04,qx=x*Math.cos(ra)-z*Math.sin(ra),qz=x*Math.sin(ra)+z*Math.cos(ra)-3.5,sc=3.5/Math.max(.3,-qz),px=qx*sc,py=y*sc,B=active.box,L=active.lh,r=Math.hypot((px-(B[0]+B[1])/2)/((B[1]-B[0])/2+L),(py-(B[2]+B[3])/2)/((B[3]-B[2])/2+L)),u=Math.min(1,Math.max(0,(r-.5)/1.2)),h=1-u*u*(3-2*u);return h};const SLOW=1;async function start(now){const ra=rotA*.04+.1,ca=Math.cos(ra),sa=Math.sin(ra);loading=true;const QP=new URLSearchParams(location.search),p=byId[QP.get("poem")]||byId[pick()],g=QP.has("poem")?p.groups[0]:p.groups[Math.random()*p.groups.length|0],b=await bin(p.file);
let ox=0,oy=0;for(let tr=0;tr<40;tr++){ox=(Math.random()-.5)*.6;oy=(Math.random()-.5)*.8;if(A.every(a=>Math.hypot(a.pos[0]-ox*ca,a.pos[1]-oy,a.pos[2]+ox*sa)>1.2*a.radius))break}
const dimIds=new Set(A.filter(a=>Math.hypot(a.pos[0]-ox*ca,a.pos[1]-oy,a.pos[2]+ox*sa)<2*a.radius+.6).map(a=>a.id)),idx=[];mark.fill(0);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
for(let k=0;k<g.count&&k<N;k++){const i=Math.random()*N|0;idx.push(i);mark[i]=1;const o=(g.offset+k)*2;
const gx=b[o]/32767*man.scale+ox,gy=b[o+1]/32767*man.scale+oy;if(gx<x0)x0=gx;if(gx>x1)x1=gx;if(gy<y0)y0=gy;if(gy>y1)y1=gy;T[i*3]=gx;T[i*3+1]=gy;T[i*3+2]=0}
active={ca,sa,box:[x0,x1,y0,y1],lh:Math.max(.08,(y1-y0)/Math.max(1,g.lines.length)),dimIds,idx,t0:performance.now()/1000,text:g.lines.join(' '),section:p.section};live.textContent=g.lines.join('\n');loading=false}
const curl=(x,y,z,t)=>[Math.sin(y*1.7+t*.3)-Math.cos(z*1.3),Math.sin(z*1.9+t*.2)-Math.cos(x*1.5),Math.sin(x*1.1+t*.25)-Math.cos(y*1.6)];
let last=performance.now();
function frame(nowMs){const dt=Math.min(.05,(nowMs-last)/1000);last=nowMs;const t=nowMs/1000;
if(!active&&!loading&&nowMs>next)start(nowMs).catch(e=>{loading=false;console.error(e)});
let wt=0,dx=0,dy=0;if(active){const tl=poemTimeline(active.text,active.t0,active.t0+(t-active.t0)/SLOW,active.section);
if(reduced&&tl.phase!=='done')wt=tl.phase==='hold'?1:tl.phase==='gather'?tl.p:1-tl.p;
else if(tl.phase==='gather')wt=tl.p;else if(tl.phase==='hold')wt=1;else if(tl.phase==='scatter')wt=1-tl.p;
if(tl.phase==='done'){active=null;mark.fill(0);next=nowMs+nextGap()*1000}else{const e=t-active.t0;dx=reduced?0:(tl.drift||0)*.1+.05*Math.sin(e*.21);dy=reduced?0:.035*Math.sin(e*.17+1)}}
let sp=0,vx=0,vy=0,vz=0,cnt={};const ang=active?(reduced?0:t*.04)+.1+(reduced?0:.12*Math.sin((t-active.t0)*.15)):0,ca0=Math.cos(ang),sa0=Math.sin(ang);const k=reduced?.3:1;
for(let i=0;i<N;i++){const j=i*3;let x=P[j],y=P[j+1],z=P[j+2];const f=curl(x,y,z,t);let ax=f[0]*.3,ay=f[1]*.3,az=f[2]*.3,best=null,bd=1e9;
for(const a of A){const ex=a.pos[0]-x,ey=a.pos[1]-y,ez=a.pos[2]-z,d=Math.hypot(ex,ey,ez)+.05;if(d<bd){bd=d;best=a}const s=.15*a.radius/(d*d+.3);ax+=ex*s;ay+=ey*s;az+=ez*s}
ax-=x*.05;ay-=y*.05;az-=z*.05;V[j]=(V[j]+ax*dt)*.97;V[j+1]=(V[j+1]+ay*dt)*.97;V[j+2]=(V[j+2]+az*dt)*.97;
const cz=mark[i]?0:calmAt(x,y,z)*wt;x+=V[j]*dt*k*(1-.8*cz);y+=V[j+1]*dt*k*(1-.8*cz);z+=V[j+2]*dt*k*(1-.8*cz);
if(mark[i]&&wt>0){const s=wt>=.999?1:Math.min(1,.04+.5*wt*wt*wt);const lx=T[j]+dx;x+=(lx*ca0-x)*s;y+=(T[j+1]+dy-y)*s;z+=(-lx*sa0-z)*s;if(s===1){V[j]=V[j+1]=V[j+2]=0}}
P[j]=x;P[j+1]=y;P[j+2]=z;sp+=Math.hypot(V[j],V[j+1],V[j+2]);vx+=V[j];vy+=V[j+1];vz+=V[j+2];
let c;{const hw=Math.max(0,1-bd/(best.radius*2));c=hsl(220+(best.hue-220)*hw,.15+.5*hw,.33+.15*hw);if(active&&active.dimIds.has(best.id)){const m=1-.6*wt;c=[c[0]*m,c[1]*m,c[2]*m]}cnt[best.id]=(cnt[best.id]||0)+1}
if(mark[i]&&wt>0){const u=Math.min(1,wt/.4),e=u*u*(3-2*u),W=[.93*.55,.9*.55,.84*.55];c=[c[0]+(W[0]-c[0])*e,c[1]+(W[1]-c[1])*e,c[2]+(W[2]-c[2])*e]}else if(!mark[i]&&cz>0){const m=1-.85*cz;c=[c[0]*m,c[1]*m,c[2]*m]}
if(!mark[i]){const rr=Math.hypot(x,y,z),v=Math.min(1,Math.max(0,(rr-1.0)/1.0)),ef=1-v*v*(3-2*v);c=[c[0]*ef,c[1]*ef,c[2]*ef]}C[j]=c[0];C[j+1]=c[1];C[j+2]=c[2]}
gl.clearColor(5/255,7/255,13/255,1);gl.clear(gl.COLOR_BUFFER_BIT);
gl.bindBuffer(gl.ARRAY_BUFFER,bp);gl.bufferData(gl.ARRAY_BUFFER,P,gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,3,gl.FLOAT,false,0,0);
gl.bindBuffer(gl.ARRAY_BUFFER,bc);gl.bufferData(gl.ARRAY_BUFFER,C,gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(lc);gl.vertexAttribPointer(lc,3,gl.FLOAT,false,0,0);
gl.uniform1f(gl.getUniformLocation(pr,'t'),(rotA=reduced?0:t));gl.uniform1f(gl.getUniformLocation(pr,'asp'),aspect);gl.drawArrays(gl.POINTS,0,N);
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
window.coeShowPoemNow=()=>{next=0};
</script></body></html>
