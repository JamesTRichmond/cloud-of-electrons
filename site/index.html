// Tactical 3D Map State & Engine
const NMS_MAP={
 cv:null,ctx:null,open:false,
 az:0.26,el:-0.92,zoom:0.46,
 cx:0,cy:0,cz:-900,
 drag:false,lx:0,ly:0,
 hoveredTarget:null,screenNodes:[],rafId:null
};

const getAllDestinations=()=>[...VOID_WELLS,{id:'jamestellation',name:'Jamestellation Deep Void Portal',pos:[-1.94,21.6,-1850],radius:45,isPortal:true}];

let mapTouch=null;
function initNmsMapCanvas(){
 if(NMS_MAP.cv)return;
 NMS_MAP.cv=document.getElementById('nms-galactic-map-c');
 if(!NMS_MAP.cv)return;
 NMS_MAP.ctx=NMS_MAP.cv.getContext('2d');
 
 const cv=NMS_MAP.cv;
 mapTouch=mountMapTouch(cv,(dx,dy)=>{
  if(!NMS_MAP.open||!cv.clientWidth||!cv.clientHeight)return;
  NMS_MAP.az+=(dx/cv.clientWidth)*2.8;
  NMS_MAP.el=Math.max(-1.45,Math.min(-0.15,NMS_MAP.el-(dy/cv.clientHeight)*2.2));
 });
 cv.addEventListener('mousedown',e=>{
  if(e.button===0){NMS_MAP.drag=true;NMS_MAP.lx=e.clientX;NMS_MAP.ly=e.clientY;}
 });
 window.addEventListener('mouseup',()=>{NMS_MAP.drag=false;});
 cv.addEventListener('mousemove',e=>{
  if(NMS_MAP.drag){
   const dx=e.clientX-NMS_MAP.lx,dy=e.clientY-NMS_MAP.ly;
   NMS_MAP.az+=(dx/cv.clientWidth)*2.8;
   NMS_MAP.el=Math.max(-1.45,Math.min(-0.15,NMS_MAP.el-(dy/cv.clientHeight)*2.2));
   NMS_MAP.lx=e.clientX;NMS_MAP.ly=e.clientY;
  }
  // Hover detection
  const rect=cv.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  let closest=null,minDist=32;
  for(const sn of NMS_MAP.screenNodes){
   const d=Math.hypot(sn.sx-mx,sn.sy-my);
   if(d<minDist){minDist=d;closest=sn;}
  }
  updateNmsHover(closest);
 });
 cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=e.deltaY>0?0.90:1.11;
  NMS_MAP.zoom=Math.max(0.12,Math.min(2.4,NMS_MAP.zoom*factor));
 },{passive:false});

   closeMap();

  }
 });

 if(btnEngage){
  btnEngage.onclick=()=>{

    closeMap();

 }

function updateNmsHover(node){
 NMS_MAP.hoveredTarget=node;
 const card=document.getElementById('nms-hover-card');
 if(!card)return;
 if(!node){card.classList.add('hidden');return;}
 const T=node.target;
 const dist=Math.round(Math.hypot(T.pos[0]-VD.pos[0],T.pos[1]-VD.pos[1],T.pos[2]-VD.pos[2]));
 document.getElementById('nms-card-name').textContent=T.name;
 document.getElementById('nms-card-pos').textContent=`[${Math.round(T.pos[0])}, ${Math.round(T.pos[1])}, ${Math.round(T.pos[2])}]`;
 document.getElementById('nms-card-dist').textContent=`${dist} LIGHT YEARS`;
 document.getElementById('nms-card-type').textContent=T.isPortal?'WORMHOLE SINGULARITY':'CELESTIAL REALM GALAXY';

 card.classList.remove('hidden');
}

function renderNmsMapFrame(){
 if(!NMS_MAP.open)return;
 const cv=NMS_MAP.cv,ctx=NMS_MAP.ctx;
 if(!cv||!ctx)return;
 const w=cv.clientWidth,h=cv.clientHeight;
 if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}

 ctx.fillStyle='#04060c';ctx.fillRect(0,0,w,h);
 
 const bgGrad=ctx.createRadialGradient(w*0.5,h*0.45,20,w*0.5,h*0.5,w*0.75);
 bgGrad.addColorStop(0,'rgba(16,25,50,0.65)');
 bgGrad.addColorStop(0.5,'rgba(8,12,24,0.4)');
 bgGrad.addColorStop(1,'rgba(2,3,6,0.95)');
 ctx.fillStyle=bgGrad;ctx.fillRect(0,0,w,h);

 const az=NMS_MAP.az,el=NMS_MAP.el,zoom=NMS_MAP.zoom;
 const caz=Math.cos(az),saz=Math.sin(az),cel=Math.cos(el),sel=Math.sin(el);
 const cx=NMS_MAP.cx,cz=NMS_MAP.cz;

 const project=(x,y,z)=>{
  const dx=x-cx,dy=y,dz=z-cz;
  const rx=dx*caz+dz*saz;
  const rz=-dx*saz+dz*caz;
  const ry=dy*cel-rz*sel;
  const rz2=dy*sel+rz*cel;
  const distCam=2200/zoom;
  const pz=rz2+distCam;
  if(pz<40)return null;
  const sc=(w*0.88)/pz;
  return {sx:w*0.5+rx*sc,sy:h*0.52-ry*sc,depth:pz,scale:sc};
 };

 // 1. Draw Celestial Plane Grid (Y = 0)
 ctx.lineWidth=1;
 ctx.strokeStyle='rgba(80,180,225,0.09)';
 for(let gz=200;gz>=-2100;gz-=150){
  const p1=project(-350,0,gz),p2=project(350,0,gz);
  if(p1&&p2){ctx.beginPath();ctx.moveTo(p1.sx,p1.sy);ctx.lineTo(p2.sx,p2.sy);ctx.stroke();}
 }
 for(let gx=-350;gx<=350;gx+=100){
  const p1=project(gx,0,200),p2=project(gx,0,-2100);
  if(p1&&p2){ctx.beginPath();ctx.moveTo(p1.sx,p1.sy);ctx.lineTo(p2.sx,p2.sy);ctx.stroke();}
 }

 // Concentric Range Rings on Plane
 ctx.strokeStyle='rgba(250,214,133,0.11)';
 for(const r of [300,700,1200,1800]){
  ctx.beginPath();
  let first=true;
  for(let a=0;a<=6.283;a+=0.2){
   const p=project(Math.cos(a)*r,0,-900+Math.sin(a)*r);
   if(p){if(first){ctx.moveTo(p.sx,p.sy);first=false;}else ctx.lineTo(p.sx,p.sy);}
  }
  ctx.stroke();
 }

 NMS_MAP.screenNodes=[];
 const allDest=getAllDestinations();

 // 2. Draw Vertical Drop Stems from Galaxies to Plane
 for(const T of allDest){
  const pTop=project(T.pos[0],T.pos[1],T.pos[2]);
  const pBase=project(T.pos[0],0,T.pos[2]);
  if(pTop&&pBase){
   ctx.beginPath();
   ctx.setLineDash([3,4]);
   ctx.strokeStyle=T.isPortal?'rgba(250,214,133,0.45)':'rgba(120,200,255,0.25)';
   ctx.moveTo(pBase.sx,pBase.sy);ctx.lineTo(pTop.sx,pTop.sy);ctx.stroke();
   ctx.setLineDash([]);
   // Anchor ring on plane
   ctx.beginPath();
   ctx.ellipse(pBase.sx,pBase.sy,Math.max(2,5*pBase.scale),Math.max(1,2.5*pBase.scale),0,0,6.28);
   ctx.fillStyle='rgba(80,180,225,0.18)';ctx.fill();
   ctx.strokeStyle='rgba(80,180,225,0.35)';ctx.stroke();
  }
 }

 // 3. Draw Visitor Ship Drop Stem & Marker
 const pShip=project(VD.pos[0],VD.pos[1],VD.pos[2]);
 const pShipBase=project(VD.pos[0],0,VD.pos[2]);
 if(pShip&&pShipBase){
  ctx.beginPath();
  ctx.setLineDash([2,3]);
  ctx.strokeStyle='rgba(255,255,255,0.6)';
  ctx.moveTo(pShipBase.sx,pShipBase.sy);ctx.lineTo(pShip.sx,pShip.sy);ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.ellipse(pShipBase.sx,pShipBase.sy,6,3,0,0,6.28);
  ctx.strokeStyle='rgba(250,214,133,0.8)';ctx.stroke();

  const nowT=performance.now()*0.003;
  const pulseR=8+(nowT%1.0)*22;
  const pulseA=1.0-(nowT%1.0);
  ctx.beginPath();
  ctx.arc(pShip.sx,pShip.sy,pulseR,0,6.28);
  ctx.strokeStyle=`rgba(250,214,133,${pulseA*0.7})`;ctx.stroke();

  ctx.beginPath();
  ctx.fillStyle='#ffffff';
  ctx.arc(pShip.sx,pShip.sy,4.5,0,6.28);
  ctx.fill();
  ctx.strokeStyle='#fad685';ctx.lineWidth=1.5;ctx.stroke();

  ctx.font='10px "Source Serif 4", serif';
  ctx.fillStyle='#fad685';
  ctx.fillText('▲ YOU ARE HERE',pShip.sx+10,pShip.sy+4);
 }

 // 4. Draw Trajectory Line if Hovering
 if(NMS_MAP.hoveredTarget&&pShip){
  const hPos=NMS_MAP.hoveredTarget.target.pos;
  const pHov=project(hPos[0],hPos[1],hPos[2]);
  if(pHov){
   ctx.beginPath();
   ctx.setLineDash([4,4]);
   ctx.strokeStyle='rgba(250,214,133,0.75)';
   ctx.lineWidth=1.5;
   ctx.moveTo(pShip.sx,pShip.sy);ctx.lineTo(pHov.sx,pHov.sy);ctx.stroke();
   ctx.setLineDash([]);
  }
 }

 // 5. Draw Galaxy Nodes
 for(const T of allDest){
  const p=project(T.pos[0],T.pos[1],T.pos[2]);
  if(!p)continue;
  NMS_MAP.screenNodes.push({sx:p.sx,sy:p.sy,target:T});

  const isHov=NMS_MAP.hoveredTarget&&NMS_MAP.hoveredTarget.target.id===T.id;
  const isPortal=T.isPortal;
  const nodeRad=Math.max(4,Math.min(18,(isPortal?9:6)*p.scale));

  const auraGrad=ctx.createRadialGradient(p.sx,p.sy,nodeRad*0.2,p.sx,p.sy,nodeRad*(isHov?3.5:2.2));
  if(isPortal){
   auraGrad.addColorStop(0,'rgba(255,255,255,0.95)');
   auraGrad.addColorStop(0.3,'rgba(250,214,133,0.85)');
   auraGrad.addColorStop(0.7,'rgba(215,80,180,0.4)');
   auraGrad.addColorStop(1,'rgba(0,0,0,0)');
  }else if(isHov){
   auraGrad.addColorStop(0,'rgba(255,255,255,0.95)');
   auraGrad.addColorStop(0.4,'rgba(250,214,133,0.8)');
   auraGrad.addColorStop(1,'rgba(0,0,0,0)');
  }else{
   auraGrad.addColorStop(0,'rgba(220,240,255,0.85)');
   auraGrad.addColorStop(0.5,'rgba(100,180,245,0.35)');
   auraGrad.addColorStop(1,'rgba(0,0,0,0)');
  }
  ctx.fillStyle=auraGrad;
  ctx.beginPath();ctx.arc(p.sx,p.sy,nodeRad*(isHov?3.5:2.2),0,6.28);ctx.fill();

  ctx.fillStyle=isPortal?'#ffffff':(isHov?'#ffffff':'#fad685');
  ctx.beginPath();ctx.arc(p.sx,p.sy,nodeRad*0.65,0,6.28);ctx.fill();

  if(isHov){
   const bSz=nodeRad*2.2;
   ctx.strokeStyle='#fad685';ctx.lineWidth=1.5;
   ctx.beginPath();
   ctx.moveTo(p.sx-bSz,p.sy-bSz+6);ctx.lineTo(p.sx-bSz,p.sy-bSz);ctx.lineTo(p.sx-bSz+6,p.sy-bSz);
   ctx.moveTo(p.sx+bSz,p.sy-bSz+6);ctx.lineTo(p.sx+bSz,p.sy-bSz);ctx.lineTo(p.sx+bSz-6,p.sy-bSz);
   ctx.moveTo(p.sx-bSz,p.sy+bSz-6);ctx.lineTo(p.sx-bSz,p.sy+bSz);ctx.lineTo(p.sx-bSz+6,p.sy+bSz);
   ctx.moveTo(p.sx+bSz,p.sy+bSz-6);ctx.lineTo(p.sx+bSz,p.sy+bSz);ctx.lineTo(p.sx+bSz-6,p.sy+bSz);
   ctx.stroke();
  }

  ctx.font=`${isHov?'600 12px':'10.5px'} "Source Serif 4", serif`;
  ctx.fillStyle=isHov?'#ffffff':'#EDE6D6';
  ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=6;
  ctx.fillText(T.name,p.sx+nodeRad+6,p.sy+3);
  ctx.shadowBlur=0;
 }

 const cEl=document.getElementById('nms-ship-coord');
 if(cEl)cEl.textContent=`[${Math.round(VD.pos[0])}, ${Math.round(VD.pos[1])}, ${Math.round(VD.pos[2])}]`;
 const hEl=document.getElementById('nms-ship-heading');

 if(NMS_MAP.open)NMS_MAP.rafId=requestAnimationFrame(renderNmsMapFrame);
}

// HUD access follows its existing flight visibility, never opacity alone.
function updateHudAccess(dt){
 const focused=hudEl.contains(document.activeElement);
 if(VD.mode==='fly'){
  if(VD.hudTimer>0&&!focused)VD.hudTimer=Math.max(0,VD.hudTimer-dt);
  hudEl.classList.toggle('active',VD.hudTimer>0||VD.hudHover||focused);
 }
 const available=VD.mode==='fly'&&hudEl.classList.contains('active');
 if(!available&&mapControl.contains(document.activeElement)){
  cv.tabIndex=-1;cv.focus({preventScroll:true});
 }
 if(mapControl.inert!==!available){
  mapControl.inert=!available;mapControl.tabIndex=available?0:-1;
  mapControl.setAttribute('aria-disabled',String(!available));
 }
}

function enterOrbit(W){if(!W)return;
