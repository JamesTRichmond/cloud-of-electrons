[poemSel,med].forEach(sel=>{sel.addEventListener('pointerenter',e=>{hide();if(e.pointerType==='touch'||!cut(sel))return;tm=setTimeout(()=>{const r=sel.getBoundingClientRect();d.textContent=sel.options[sel.selectedIndex].textContent;d.style.display='block';d.style.opacity=0;d.offsetWidth;d.style.transition=reduced?'none':'opacity 150ms';d.style.opacity=1;d.style.left=r.left+'px';d.style.top=(r.top-d.offsetHeight-4)+'px';window.coeTipShownAt=performance.now()},1000)});['pointerleave','change','mousedown','keydown','blur'].forEach(ev=>sel.addEventListener(ev,hide))});return{hide,cut}})();window.coeTip=ofTip;
$('of-go').onclick=()=>{if(MODE==='poetry'){if(POEMS_ON){stopPoetry();return}beginPoem();return}if(window.coeMed){stopMed();return}medStart(OF[+med.value]);$('of-go').textContent='End'};
// On open: only swirl + brown noise (volume slider at 50%). Browsers block audio until a user gesture, so we try now
// and, if the AudioContext is suspended, resume on the first pointer/key/touch.
{const ctx=ac();window.coeAudioState=()=>ctx.state;if(!BN.playing)BN.start(ctx,+$('of-vol').value);window.coeAutoplay=ctx.state==='running'?'autoplayed':'blocked-until-gesture';
 if(ctx.state!=='running'){const go=()=>{ctx.resume().then(()=>{window.coeAutoplay='started-on-first-gesture'});['pointerdown','keydown','touchstart'].forEach(e=>removeEventListener(e,go,true))};['pointerdown','keydown','touchstart'].forEach(e=>addEventListener(e,go,true))}}
$('of-sil').onclick=()=>{stopMed();stopPoetry();if(BN.playing)BN.stop(3)};
window.coeTestCaption=l=>{if(active&&!active.cap){active=null;mark.fill(0)}window.coeMed={m:{steps:[{t:l,p:30}]},i:0};capWait=0};
